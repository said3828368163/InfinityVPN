<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfinityVPN</title>
  <meta name="description" content="InfinityVPN — Официальный переход в Telegram-бота">
  <meta property="og:title" content="InfinityVPN">
  <meta property="og:description" content="Переход в официальный Telegram-бот @InfinityVPN_serverHost_bot">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #030712;
      color: #f3f4f6;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ambient-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.3;
      pointer-events: none;
      z-index: 0;
      animation: pulse 8s ease-in-out infinite alternate;
    }
    .glow-1 {
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, #06b6d4, #2563eb);
    }
    .glow-2 {
      bottom: -120px;
      right: 20%;
      background: radial-gradient(circle, #7c3aed, #06b6d4);
    }
    @keyframes pulse {
      0% { transform: scale(1) translate(-50%, 0); opacity: 0.25; }
      100% { transform: scale(1.15) translate(-50%, 30px); opacity: 0.4; }
    }
    .grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      margin: 20px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 44px 32px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(6, 182, 212, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: enterCard 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes enterCard {
      from { opacity: 0; transform: scale(0.94) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .logo {
      width: 84px;
      height: 84px;
      border-radius: 26px;
      background: linear-gradient(135deg, #06b6d4 0%, #2563eb 50%, #7c3aed 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      box-shadow: 0 0 35px rgba(6, 182, 212, 0.5);
      animation: floatLogo 4s ease-in-out infinite alternate;
    }
    @keyframes floatLogo {
      0% { transform: translateY(0); }
      100% { transform: translateY(-6px); }
    }
    .logo svg {
      width: 44px;
      height: 44px;
      fill: #ffffff;
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(to right, #ffffff, #93c5fd, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .status-widget {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 14px 18px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
      text-align: left;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: #e2e8f0;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }
    .status-days {
      font-weight: 700;
      color: #38bdf8;
    }
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #06b6d4, #3b82f6);
      border-radius: 999px;
      transition: width 0.5s ease;
    }
    .status-sub {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #64748b;
    }
    .btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #ffffff;
      padding: 18px 24px;
      border-radius: 18px;
      text-decoration: none;
      font-weight: 700;
      font-size: 17px;
      box-shadow: 0 10px 30px rgba(2, 132, 199, 0.45);
      transition: all 0.25s ease;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 38px rgba(2, 132, 199, 0.65);
      background: linear-gradient(135deg, #0ea5e9 0%, #1d4ed8 100%);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn svg {
      width: 24px;
      height: 24px;
      fill: #ffffff;
    }
  </style>
</head>
<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="grid"></div>

  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18l7 3.12v4.7c0 4.67-3.13 8.97-7 10.05-3.87-1.08-7-5.38-7-10.05V6.3l7-3.12zm-1 5.82v6h2v-6h-2zm0 8v2h2v-2h-2z"/>
      </svg>
    </div>

    <h1>InfinityVPN</h1>
    <p class="subtitle">Официальный Telegram Бот сервиса</p>

    <!-- ИНФОРМАЦИЯ О ПОДПИСКЕ И ДНЯХ -->
    <div class="status-widget">
      <div class="status-row">
        <div class="status-badge">
          <span class="dot" id="dot"></span>
          <span>Подписка 30 дней</span>
        </div>
        <div class="status-days" id="daysText">30 из 30 дн.</div>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="barFill" style="width: 100%;"></div>
      </div>
      <div class="status-sub">
        <span id="trafficText">Трафик: 100 GB</span>
        <span id="expiryText">Истекает: 25.10.2026</span>
      </div>
    </div>

    <!-- КНОПКА ПЕРЕХОДА В ТЕЛЕГРАМ БОТА -->
    <a href="https://t.me/InfinityVPN_serverHost_bot" class="btn">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
      </svg>
      <span>Перейти в Telegram-бота</span>
    </a>
  </div>

  <script>
    fetch('./status.json')
      .then(res => res.json())
      .then(data => {
        if (data && data.remaining_days !== undefined) {
          document.getElementById('daysText').innerText = data.remaining_days + ' из ' + data.total_days + ' дн.';
          document.getElementById('trafficText').innerText = 'Трафик: ' + data.traffic_remaining_gb + ' GB / ' + data.traffic_total_gb + ' GB';
          if (data.progress_percent !== undefined) {
            document.getElementById('barFill').style.width = data.progress_percent + '%';
          }
          if (data.status === 'expired') {
            document.getElementById('dot').style.background = '#ef4444';
            document.getElementById('dot').style.boxShadow = '0 0 10px #ef4444';
            document.getElementById('daysText').innerText = 'Срок истёк';
            document.getElementById('daysText').style.color = '#ef4444';
          }
        }
      })
      .catch(e => console.log('Status load fallback to defaults', e));
  </script>
</body>
</html>
